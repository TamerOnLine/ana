<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5d2743">
  <meta name="description" content="Eine herzliche Dankesbotschaft für Ana Maria.">
  <title>Für unsere liebe Ana Maria</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Source+Sans+3:wght@400;500;600;700&display=swap');
    :root{--plum:#402031;--wine:#6b2f50;--rose:#b96985;--cream:#fffdf9;--gold:#c59552;--ink:#3e3440}
    *{box-sizing:border-box} html{background:#271220} body{margin:0;min-height:100vh;color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;background:radial-gradient(ellipse at 12% 7%,rgba(244,180,195,.27),transparent 31%),radial-gradient(ellipse at 91% 88%,rgba(236,193,108,.23),transparent 30%),radial-gradient(ellipse at 82% 14%,rgba(153,69,111,.32),transparent 29%),linear-gradient(135deg,#2b1022 0%,#51213c 43%,#783958 73%,#301426 100%)}
    .page{position:relative;isolation:isolate;min-height:100vh;display:grid;place-items:center;padding:clamp(22px,5vw,72px) 18px;overflow:hidden;background:linear-gradient(110deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(20deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px,42px 42px}
    .page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0 34%,rgba(18,5,14,.1) 100%);z-index:-1}.orb{position:absolute;border-radius:50%;filter:blur(14px);z-index:-1}.orb.one{width:470px;height:470px;background:radial-gradient(circle,rgba(255,205,220,.58),rgba(255,177,202,.06) 67%,transparent 72%);top:-220px;right:-135px}.orb.two{width:440px;height:440px;background:radial-gradient(circle,rgba(250,204,110,.46),rgba(222,153,85,.06) 67%,transparent 72%);bottom:-250px;left:-145px}
    main{width:min(900px,100%);background:linear-gradient(145deg,rgba(255,255,255,.99),rgba(255,250,244,.97));border:1px solid rgba(255,255,255,.82);box-shadow:0 40px 100px rgba(24,7,19,.48),0 0 0 10px rgba(255,232,221,.055);padding:clamp(32px,7vw,86px);position:relative}.frame{position:absolute;inset:12px;border:1px solid rgba(197,149,82,.5);pointer-events:none}.frame:before,.frame:after{content:"✦";position:absolute;color:var(--gold);font-size:14px}.frame:before{top:-10px;left:-7px}.frame:after{right:-7px;bottom:-10px}
    .language-bar{position:relative;z-index:2;display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:0 auto 28px;max-width:620px}.language-bar button{appearance:none;border:1px solid rgba(107,47,80,.2);border-radius:999px;background:rgba(255,255,255,.66);padding:7px 11px;font:700 .7rem/1 "Source Sans 3",sans-serif;letter-spacing:.08em;color:var(--wine);cursor:pointer;transition:.2s ease}.language-bar button:hover{transform:translateY(-1px);border-color:rgba(107,47,80,.55)}.language-bar button[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:0 5px 12px rgba(107,47,80,.22)}
    .eyebrow{margin:0 0 17px;text-align:center;text-transform:uppercase;letter-spacing:.27em;font-weight:700;font-size:.69rem;color:var(--wine)}.motif{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);font-size:1.35rem;margin-bottom:19px}.motif:before,.motif:after{content:"";height:1px;width:58px;background:linear-gradient(90deg,transparent,var(--gold))}.motif:after{transform:scaleX(-1)}
    h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(3rem,8vw,5.85rem);font-weight:600;line-height:.92;letter-spacing:-.035em;text-align:center;color:var(--plum);margin:0 auto 28px;max-width:720px;text-wrap:balance}.dear{font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.38rem,3vw,1.84rem);font-weight:500;font-style:italic;text-align:center;letter-spacing:.01em;color:var(--wine);margin:0 0 44px}.intro{max-width:680px;margin:0 auto 40px;text-align:center;font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.35rem,3vw,1.7rem);font-weight:500;letter-spacing:-.008em;line-height:1.48;color:var(--plum)}.intro strong{font-weight:700}
    .copy{max-width:670px;margin:auto;font-size:clamp(1.03rem,1.3vw,1.1rem);font-weight:400;letter-spacing:.004em;line-height:1.88}.copy p{margin:0 0 24px}.copy p:first-child:first-letter{float:left;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:4.45rem;line-height:.74;color:var(--wine);padding:.13em .15em 0 0}.sun{display:block;text-align:center;font-size:1.5rem;margin:22px 0 -2px}
    .wishes{margin:54px auto 38px;max-width:670px;background:linear-gradient(110deg,#f9eaf0,#fdf4e4);padding:clamp(24px,4vw,38px);text-align:center;border-top:1px solid rgba(197,149,82,.65);border-bottom:1px solid rgba(197,149,82,.65)}.wishes h2{font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.85rem,4vw,2.22rem);font-weight:600;letter-spacing:-.02em;margin:0 0 19px;color:var(--plum)}.wishes ul{padding:0;margin:0;list-style:none;display:grid;gap:11px}.wishes li{font-size:1.04rem;font-weight:500;letter-spacing:.008em}.wishes li:before{content:"✦";color:var(--gold);font-size:.75rem;margin-inline-end:10px}
    blockquote{max-width:640px;margin:0 auto;font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.28rem,3vw,1.62rem);font-weight:500;line-height:1.52;text-align:center;font-style:italic;letter-spacing:.004em;color:var(--wine)}.signoff{text-align:center;margin:50px 0 0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.76rem,4vw,2.42rem);font-weight:700;letter-spacing:-.02em;color:var(--plum)}.heart{color:#bd5a73}.dedication{margin:28px auto 0;text-align:center;color:var(--wine)}.dedication .from{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.12rem,2.4vw,1.32rem);font-style:italic;letter-spacing:.01em}.dedication .date{margin:8px 0 0;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--gold)}footer{position:absolute;bottom:22px;font-size:.67rem;letter-spacing:.12em;color:rgba(255,255,255,.72);text-transform:uppercase}
    [dir="rtl"] .copy{text-align:right}[dir="rtl"] .copy p:first-child:first-letter{float:right;padding:.13em 0 0 .15em}[dir="rtl"] .wishes li:before{margin-inline-end:0;margin-inline-start:10px}[dir="rtl"] .eyebrow{letter-spacing:.09em}[dir="rtl"] .dedication .date{letter-spacing:.04em}
    @media(max-width:560px){.page{padding:16px 10px 46px}.frame{inset:8px}.copy{font-size:1rem;line-height:1.86}.motif{margin-bottom:14px}.intro{margin-bottom:30px}.wishes{margin-top:38px}.signoff{margin-top:38px}.language-bar{gap:5px;margin-bottom:24px}.language-bar button{padding:7px 9px;font-size:.65rem}}@media(prefers-reduced-motion:no-preference){main{animation:rise .7s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <div class="page"><div class="orb one"></div><div class="orb two"></div>
    <main>
      <div class="frame"></div>
      <nav class="language-bar" aria-label="Language selection">
        <button type="button" data-lang="de" aria-pressed="true">DE</button><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="ar" aria-pressed="false">العربية</button><button type="button" data-lang="ru" aria-pressed="false">RU</button><button type="button" data-lang="uk" aria-pressed="false">UK</button><button type="button" data-lang="ro" aria-pressed="false">RO</button>
      </nav>
      <p class="eyebrow" id="eyebrow"></p><div class="motif">🌷</div><h1 id="title"></h1><p class="dear" id="dear"></p><p class="intro" id="intro"></p>
      <div class="copy"><p id="p1"></p><p id="p2"></p><p id="p3"></p><span class="sun">☀️</span><p id="p4"></p></div>
      <section class="wishes" aria-labelledby="wishes-title"><h2 id="wishes-title"></h2><ul><li id="wish1"></li><li id="wish2"></li><li id="wish3"></li></ul></section>
      <blockquote id="quote"></blockquote><p class="signoff" id="signoff"></p><div class="dedication"><p class="from" id="from"></p><p class="date" id="date"></p></div>
    </main><footer id="footer"></footer>
  </div>
  <script>
    const texts={
      de:{eyebrow:"Mit großer Wertschätzung",title:"Für unsere<br>liebe Ana Maria",dear:"Liebe Ana Maria,",intro:"von Herzen danken wir dir für deine <strong>Geduld</strong>, deine <strong>Unterstützung</strong> und deine große <strong>Hingabe</strong>.",p1:"Mit deiner positiven Art, deinem wunderbaren Sinn für Humor, deiner Ausdauer und deinem großen Herzen hast du unseren Unterricht zu etwas ganz Besonderem gemacht.",p2:"Du hast uns nicht nur Deutsch beigebracht, sondern uns auch stets ermutigt, an uns selbst zu glauben. Du hast uns Freude am Lernen und mehr Selbstvertrauen geschenkt.",p3:"Mit deiner leichten und freundlichen Art bringst du Freude und Wärme in unseren Alltag. Möge dein Leben stets so hell und klar sein wie ein sonniger Himmel.",p4:"Für viele von uns bist du nicht nur eine großartige Lehrerin, sondern auch eine liebevolle und gute Freundin. Deine Freundlichkeit und alles, was du für uns getan hast, werden wir in schöner Erinnerung behalten.",wishes:"Für deine Zukunft wünschen wir dir",wish1:"Gesundheit und Glück",wish2:"Erfolg auf allen Wegen",wish3:"Die Erfüllung deiner Wünsche und Träume",quote:"„Möge der Herr dich und deine Angehörigen beschützen und dich stets mit lieben Menschen umgeben.“ 🙏",signoff:"Vielen Dank für alles, liebe Ana Maria! <span class='heart'>♥</span>",from:"Von deinen Schülerinnen und Schülern",date:"28. August 2026",footer:"Mit Liebe und Dankbarkeit"},
      en:{eyebrow:"With heartfelt appreciation",title:"For our dear<br>Ana Maria",dear:"Dear Ana Maria,",intro:"we thank you from the bottom of our hearts for your <strong>patience</strong>, your <strong>support</strong>, and your great <strong>dedication</strong>.",p1:"With your positive spirit, your wonderful sense of humor, your perseverance, and your big heart, you made our lessons truly special.",p2:"You taught us much more than German: you always encouraged us to believe in ourselves. You gave us joy in learning and greater self-confidence.",p3:"With your gentle and kind nature, you bring joy and warmth into our everyday lives. May your life always be as bright and clear as a sunny sky.",p4:"For many of us, you are not only a wonderful teacher but also a caring and good friend. We will remember your kindness and everything you have done for us with gratitude.",wishes:"For your future, we wish you",wish1:"Health and happiness",wish2:"Success on every path",wish3:"May all your wishes and dreams come true",quote:"“May the Lord protect you and your loved ones, and always surround you with kind people.” 🙏",signoff:"Thank you for everything, dear Ana Maria! <span class='heart'>♥</span>",from:"From your students",date:"28 August 2026",footer:"With love and gratitude"},
      ar:{eyebrow:"بكل تقدير ومحبة",title:"لعزيزتنا<br>آنا ماريا",dear:"عزيزتنا آنا ماريا،",intro:"نشكركِ من أعماق قلوبنا على <strong>صبركِ</strong> و<strong>دعمكِ</strong> و<strong>تفانيكِ</strong> الكبير.",p1:"بفضل طريقتكِ الإيجابية وروحكِ المرحة الرائعة ومثابرتكِ وقلبكِ الكبير، جعلتِ دروسنا شيئًا مميزًا حقًا.",p2:"لم تُعلّمينا اللغة الألمانية فقط، بل شجّعتِنا دائمًا على الإيمان بأنفسنا. منحتِنا متعة التعلّم وثقة أكبر بالنفس.",p3:"بطريقتكِ اللطيفة والخفيفة، تضيفين الفرح والدفء إلى حياتنا اليومية. نتمنى أن تكون حياتكِ دائمًا مشرقة وصافية كسماء مشمسة.",p4:"بالنسبة إلى كثير منا، لم تكوني معلمة رائعة فحسب، بل أيضًا صديقة طيبة ومحبّة. سنحتفظ في ذاكرتنا الجميلة بلطفكِ وكل ما قدمتِه من أجلنا.",wishes:"نتمنى لكِ في مستقبلكِ",wish1:"الصحة والسعادة",wish2:"النجاح في جميع خطواتكِ",wish3:"تحقيق أمنياتكِ وأحلامكِ",quote:"«ليحفظكِ الله أنتِ وعائلتكِ، ولتكوني دائمًا محاطة بأشخاص محبين.» 🙏",signoff:"شكرًا لكِ على كل شيء، عزيزتنا آنا ماريا! <span class='heart'>♥</span>",from:"من طلابكِ وطالباتكِ",date:"28 أغسطس 2026",footer:"بكل محبة وامتنان"},
      ru:{eyebrow:"С глубокой благодарностью",title:"Для нашей дорогой<br>Анны Марии",dear:"Дорогая Анна Мария,",intro:"мы от всего сердца благодарим вас за ваше <strong>терпение</strong>, <strong>поддержку</strong> и большую <strong>преданность делу</strong>.",p1:"Ваше позитивное отношение, прекрасное чувство юмора, настойчивость и большое сердце сделали наши занятия по-настоящему особенными.",p2:"Вы научили нас не только немецкому языку, но и всегда вдохновляли верить в себя. Вы подарили нам радость учёбы и больше уверенности в себе.",p3:"Своей лёгкостью и добротой вы приносите радость и тепло в нашу повседневную жизнь. Пусть ваша жизнь всегда будет такой же светлой и ясной, как солнечное небо.",p4:"Для многих из нас вы не только замечательный учитель, но и добрый, заботливый друг. Мы сохраним в памяти вашу доброту и всё, что вы для нас сделали.",wishes:"От всей души желаем вам",wish1:"Здоровья и счастья",wish2:"Успеха на каждом пути",wish3:"Исполнения всех желаний и мечтаний",quote:"«Пусть Господь хранит вас и ваших близких и всегда окружает добрыми людьми.» 🙏",signoff:"Спасибо за всё, дорогая Анна Мария! <span class='heart'>♥</span>",from:"От ваших учеников",date:"28 августа 2026",footer:"С любовью и благодарностью"},
      uk:{eyebrow:"З великою вдячністю",title:"Для нашої дорогої<br>Ани Марії",dear:"Дорога Ано Маріє,",intro:"ми щиро дякуємо вам за ваше <strong>терпіння</strong>, <strong>підтримку</strong> та велику <strong>відданість</strong>.",p1:"Ваш позитивний підхід, чудове почуття гумору, наполегливість і велике серце зробили наші заняття по-справжньому особливими.",p2:"Ви навчили нас не лише німецької мови, а й завжди заохочували вірити в себе. Ви подарували нам радість навчання та більше впевненості в собі.",p3:"Своєю легкою та доброзичливою вдачею ви приносите радість і тепло в наше повсякденне життя. Нехай ваше життя завжди буде таким же світлим і ясним, як сонячне небо.",p4:"Для багатьох із нас ви не лише чудова вчителька, а й добра та турботлива подруга. Ми збережемо у світлій пам’яті вашу доброту й усе, що ви для нас зробили.",wishes:"Від щирого серця бажаємо вам",wish1:"Здоров’я і щастя",wish2:"Успіху на кожному шляху",wish3:"Здійснення всіх ваших бажань і мрій",quote:"«Нехай Господь береже вас і ваших близьких та завжди оточує добрими людьми.» 🙏",signoff:"Дякуємо за все, дорога Ано Маріє! <span class='heart'>♥</span>",from:"Від ваших учнів",date:"28 серпня 2026 року",footer:"З любов’ю та вдячністю"},
      ro:{eyebrow:"Cu recunoștință din inimă",title:"Pentru draga noastră<br>Ana Maria",dear:"Dragă Ana Maria,",intro:"îți mulțumim din toată inima pentru <strong>răbdarea</strong>, <strong>sprijinul</strong> și marea ta <strong>dăruire</strong>.",p1:"Prin felul tău pozitiv, minunatul simț al umorului, perseverență și inima ta mare, ai făcut ca lecțiile noastre să fie cu adevărat speciale.",p2:"Nu ne-ai predat doar limba germană, ci ne-ai încurajat mereu să credem în noi înșine. Ne-ai dăruit bucuria de a învăța și mai multă încredere în noi.",p3:"Prin firea ta ușoară și prietenoasă, aduci bucurie și căldură în viața noastră de zi cu zi. Fie ca viața ta să fie mereu la fel de luminoasă și senină ca un cer însorit.",p4:"Pentru mulți dintre noi, nu ești doar o profesoară minunată, ci și o prietenă bună și grijulie. Ne vom aminti cu drag de bunătatea ta și de tot ce ai făcut pentru noi.",wishes:"Pentru viitor îți dorim",wish1:"Sănătate și fericire",wish2:"Succes pe toate drumurile",wish3:"Împlinirea tuturor dorințelor și viselor tale",quote:"„Fie ca Domnul să te ocrotească pe tine și pe cei dragi ai tăi și să te înconjoare mereu de oameni buni.” 🙏",signoff:"Îți mulțumim pentru tot, dragă Ana Maria! <span class='heart'>♥</span>",from:"De la elevii tăi",date:"28 august 2026",footer:"Cu dragoste și recunoștință"}
    };
    const ids=["eyebrow","title","dear","intro","p1","p2","p3","p4","wishes","wish1","wish2","wish3","quote","signoff","from","date","footer"];
    function setLanguage(lang){
      const t=texts[lang]||texts.de; const root=document.documentElement; const rtl=lang==="ar";
      root.lang=lang; root.dir=rtl?"rtl":"ltr"; document.title=t.title.replace("<br>"," ");
      ids.forEach(id=>{const el=document.getElementById(id==="wishes"?"wishes-title":id); if(el) el.innerHTML=t[id]||""});
      document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
      localStorage.setItem("ana-language",lang);
    }
    document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));
    setLanguage(localStorage.getItem("ana-language")||"de");
  </script>
</body>
</html>
